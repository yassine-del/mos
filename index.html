<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Course Hub</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Header Section -->
        <header class="header">
            <h1 class="main-title">Team Course Hub</h1>
            <nav class="navigation">
                <div class="nav-tabs">
                    <button class="nav-tab active">3D Design</button>
                    <button class="nav-tab">Circuits</button>
                    <button class="nav-tab">Coding</button>
                </div>
            </nav>
        </header>

        <!-- Course Grid Section -->
        <main class="main-content">
            <div class="course-grid">
                <!-- Course Card 1 -->
                <div class="course-card">
                    <div class="course-image">
                        <div class="geometric-shapes">
                            <div class="cube"></div>
                            <div class="cylinder"></div>
                            <div class="sphere"></div>
                        </div>
                    </div>
                    <h3 class="course-title">Mecanique Elementaire</h3>
                </div>

                <!-- Course Card 2 -->
                <div class="course-card">
                    <div class="course-image">
                        <div class="printer-3d">
                            <div class="printer-body"></div>
                            <div class="printer-bed"></div>
                            <div class="printer-nozzle"></div>
                            <div class="filament"></div>
                        </div>
                    </div>
                    <h3 class="course-title">Impression 3D pour Juniors</h3>
                </div>

                <!-- Course Card 3 -->
                <div class="course-card">
                    <div class="course-image">
                        <div class="bridge-structure">
                            <div class="bridge-pillar"></div>
                            <div class="bridge-pillar"></div>
                            <div class="bridge-pillar"></div>
                            <div class="bridge-deck"></div>
                            <div class="bridge-cable"></div>
                        </div>
                    </div>
                    <h3 class="course-title">Mecanique Avancée</h3>
                </div>

                <!-- Course Card 4 -->
                <div class="course-card">
                    <div class="course-image">
                        <div class="circuit-board">
                            <div class="circuit-line"></div>
                            <div class="circuit-line"></div>
                            <div class="circuit-line"></div>
                            <div class="circuit-component"></div>
                            <div class="circuit-component"></div>
                            <div class="circuit-component"></div>
                        </div>
                    </div>
                    <h3 class="course-title">Electronique de Base</h3>
                </div>

                <!-- Course Card 5 -->
                <div class="course-card">
                    <div class="course-image">
                        <div class="robot-design">
                            <div class="robot-head"></div>
                            <div class="robot-body"></div>
                            <div class="robot-arm"></div>
                            <div class="robot-arm"></div>
                        </div>
                    </div>
                    <h3 class="course-title">Robotique Créative</h3>
                </div>

                <!-- Course Card 6 -->
                <div class="course-card">
                    <div class="course-image">
                        <div class="architecture">
                            <div class="building"></div>
                            <div class="building"></div>
                            <div class="building"></div>
                            <div class="tree"></div>
                        </div>
                    </div>
                    <h3 class="course-title">Architecture Urbaine</h3>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
